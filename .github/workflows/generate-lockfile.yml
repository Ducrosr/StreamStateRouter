name: Generate npm lockfile

on:
  push:
    branches:
      - chore/npm-lockfile-reproducible

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate lockfile
        working-directory: streamdeck-plugin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamdeck-plugin/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "chore: lock Stream Deck dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
