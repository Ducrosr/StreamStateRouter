name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Python
        run: python -m pip install -e ".[all]"
      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $Version = (python -c "import stream_state_router; print(stream_state_router.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $Version) { throw "Unable to resolve SSR version" }
          if ("v$Version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match source version v$Version"
          }
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Test Python
        run: |
          python -m unittest discover -s tests -v
          python -m ruff check .
          python main.py --check-config
      - name: Build portable EXE
        run: pyinstaller --clean --noconfirm StreamStateRouter.spec
      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\StreamStateRouter.exe)) { throw "Missing portable EXE" }
          $Process = Start-Process -FilePath .\dist\StreamStateRouter.exe -ArgumentList "--check-config" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Portable EXE smoke test failed: $($Process.ExitCode)" }
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $Path = ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip"
          New-Item -ItemType Directory -Force -Path .\release | Out-Null
          Compress-Archive -Path .\dist\StreamStateRouter.exe -DestinationPath $Path -Force
          if (-not (Test-Path $Path)) { throw "Portable ZIP missing" }
      - name: Install Stream Deck dependencies
        working-directory: streamdeck-plugin
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Stream Deck plugin
        working-directory: streamdeck-plugin
        run: |
          npm run typecheck
          npm run build
          npm run validate
          npm run pack
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" ".\installer\StreamStateRouter.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $Path = ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe"
          if (-not (Test-Path $Path)) { throw "Expected installer missing: $Path" }
      - name: Record build provenance
        shell: pwsh
        run: |
          $Manifest = [ordered]@{
            version = "${{ steps.version.outputs.version }}"
            commit = "${{ github.sha }}"
            tag = "${{ github.ref_name }}"
            python = (python --version 2>&1).ToString().Trim()
            pyinstaller = (pyinstaller --version 2>&1).ToString().Trim()
            node = (node --version 2>&1).ToString().Trim()
            npm = (npm --version 2>&1).ToString().Trim()
            runner_os = "${{ runner.os }}"
            runner_arch = "${{ runner.arch }}"
          }
          $Manifest | ConvertTo-Json | Set-Content -Encoding UTF8 .\release\build-manifest.json

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $Expected = @(
            ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip",
            ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe"
          )
          foreach ($Path in $Expected) {
            if (-not (Test-Path $Path)) { throw "Release artifact missing: $Path" }
          }
          $Plugin = Get-ChildItem .\streamdeck-plugin\*.streamDeckPlugin -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Plugin) { throw "Stream Deck plugin artifact missing" }
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*
            streamdeck-plugin/*.streamDeckPlugin
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip
            release/Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe
            streamdeck-plugin/*.streamDeckPlugin
            release/build-manifest.json
          generate_release_notes: true
