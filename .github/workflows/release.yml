name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          python -m venv .release-venv
          $Scripts = (Resolve-Path ".\.release-venv\Scripts").Path
          $Scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check "pip==26.2.1"
      - name: Install frozen Python dependency closure
        run: python -m pip install --disable-pip-version-check -r constraints/windows-release.txt
      - name: Install SSR from frozen closure
        run: python -m pip install --disable-pip-version-check --no-index --no-build-isolation -e ".[all]"
      - name: Verify Python dependency snapshot
        run: python scripts/verify_constraints.py constraints/windows-release.txt
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $Version = (python -c "import stream_state_router; print(stream_state_router.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $Version) { throw "Unable to resolve SSR version" }
          if ("v$Version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match source version v$Version"
          }
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Test Python
        run: |
          python -m unittest discover -s tests -v
          python -m ruff check .
          python main.py --check-config
      - name: Build portable EXE
        run: pyinstaller --clean --noconfirm StreamStateRouter.spec
      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\StreamStateRouter.exe)) { throw "Missing portable EXE" }
          $Process = Start-Process -FilePath .\dist\StreamStateRouter.exe -ArgumentList "--check-config" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "Portable EXE smoke test failed: $($Process.ExitCode)" }
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $Path = ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip"
          New-Item -ItemType Directory -Force -Path .\release | Out-Null
          Compress-Archive -Path .\dist\StreamStateRouter.exe -DestinationPath $Path -Force
          if (-not (Test-Path $Path)) { throw "Portable ZIP missing" }
      - name: Install Stream Deck dependencies
        working-directory: streamdeck-plugin
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Stream Deck plugin
        working-directory: streamdeck-plugin
        shell: pwsh
        run: |
          $Manifest = "com.remyducros.streamstaterouter.sdPlugin/manifest.json"
          $ManifestPath = (Resolve-Path $Manifest).Path
          $Before = [System.IO.File]::ReadAllBytes($ManifestPath)
          $PluginVersion = "${{ steps.version.outputs.version }}.0"
          try {
            npm run typecheck
            if ($LASTEXITCODE -ne 0) { throw "Stream Deck typecheck failed" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Stream Deck build failed" }
            npm run validate
            if ($LASTEXITCODE -ne 0) { throw "Stream Deck validation failed" }
            npm run pack -- --version $PluginVersion
            if ($LASTEXITCODE -ne 0) { throw "Stream Deck pack failed" }

            $Stamped = (Get-Content $Manifest -Raw | ConvertFrom-Json).Version
            if ($Stamped -ne $PluginVersion) {
              throw "Stream Deck manifest version mismatch after pack: $Stamped != $PluginVersion"
            }
          }
          finally {
            [System.IO.File]::WriteAllBytes($ManifestPath, $Before)
          }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" ".\installer\StreamStateRouter.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $Path = ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe"
          if (-not (Test-Path $Path)) { throw "Expected installer missing: $Path" }
      - name: Record build provenance
        shell: pwsh
        run: |
          $PythonConstraintsSha256 = (
            Get-FileHash -Algorithm SHA256 -Path ".\constraints\windows-release.txt"
          ).Hash.ToLowerInvariant()
          $StreamDeckLockSha256 = (
            Get-FileHash -Algorithm SHA256 -Path ".\streamdeck-plugin\package-lock.json"
          ).Hash.ToLowerInvariant()

          $Manifest = [ordered]@{
            version = "${{ steps.version.outputs.version }}"
            commit = "${{ github.sha }}"
            tag = "${{ github.ref_name }}"
            python = (python --version 2>&1).ToString().Trim()
            pyinstaller = (pyinstaller --version 2>&1).ToString().Trim()
            node = (node --version 2>&1).ToString().Trim()
            npm = (npm --version 2>&1).ToString().Trim()
            streamdeck_plugin_version = "${{ steps.version.outputs.version }}.0"
            python_constraints_sha256 = $PythonConstraintsSha256
            streamdeck_lock_sha256 = $StreamDeckLockSha256
            runner_os = "${{ runner.os }}"
            runner_arch = "${{ runner.arch }}"
          }
          $Manifest | ConvertTo-Json | Set-Content -Encoding UTF8 .\release\build-manifest.json

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $Expected = @(
            ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip",
            ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe"
          )
          foreach ($Path in $Expected) {
            if (-not (Test-Path $Path)) { throw "Release artifact missing: $Path" }
          }
          $Plugin = Get-ChildItem .\streamdeck-plugin\*.streamDeckPlugin -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $Plugin) { throw "Stream Deck plugin artifact missing" }

          $Manifest = Get-Content ".\release\build-manifest.json" -Raw | ConvertFrom-Json
          $ExpectedPythonConstraints = (
            Get-FileHash -Algorithm SHA256 -Path ".\constraints\windows-release.txt"
          ).Hash.ToLowerInvariant()
          $ExpectedStreamDeckLock = (
            Get-FileHash -Algorithm SHA256 -Path ".\streamdeck-plugin\package-lock.json"
          ).Hash.ToLowerInvariant()
          if ($Manifest.python_constraints_sha256 -ne $ExpectedPythonConstraints) {
            throw "build-manifest Python constraints hash mismatch"
          }
          if ($Manifest.streamdeck_lock_sha256 -ne $ExpectedStreamDeckLock) {
            throw "build-manifest Stream Deck lock hash mismatch"
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $Artifacts = @(
            (Get-Item ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip")
            (Get-Item ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe")
            (Get-Item ".\release\build-manifest.json")
            (Get-ChildItem .\streamdeck-plugin\*.streamDeckPlugin -ErrorAction Stop | Select-Object -First 1)
          ) | Sort-Object Name

          $Lines = foreach ($Artifact in $Artifacts) {
            if (-not $Artifact -or -not (Test-Path $Artifact.FullName)) {
              throw "Cannot hash missing release artifact"
            }
            $Hash = (Get-FileHash -Algorithm SHA256 -Path $Artifact.FullName).Hash.ToLowerInvariant()
            "$Hash  $($Artifact.Name)"
          }

          $ChecksumPath = ".\release\SHA256SUMS.txt"
          $Lines | Set-Content -Path $ChecksumPath -Encoding utf8
          if (-not (Test-Path $ChecksumPath)) { throw "Checksum manifest missing" }
      - name: Verify SHA-256 checksum manifest
        shell: pwsh
        run: |
          $ChecksumPath = ".\release\SHA256SUMS.txt"
          if (-not (Test-Path $ChecksumPath)) { throw "Checksum manifest missing" }

          $Plugin = Get-ChildItem .\streamdeck-plugin\*.streamDeckPlugin -ErrorAction Stop | Select-Object -First 1
          $Artifacts = @(
            (Get-Item ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip")
            (Get-Item ".\release\Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe")
            (Get-Item ".\release\build-manifest.json")
            $Plugin
          ) | Sort-Object Name

          $Rows = @(Get-Content $ChecksumPath)
          if ($Rows.Count -ne $Artifacts.Count) {
            throw "Checksum manifest row count mismatch: $($Rows.Count) != $($Artifacts.Count)"
          }

          $ParsedNames = @()
          $Hashes = @{}
          foreach ($Row in $Rows) {
            if ($Row -notmatch "^([0-9a-f]{64})  (.+)$") {
              throw "Invalid checksum row: $Row"
            }
            $Hash = $Matches[1]
            $Name = $Matches[2]
            if ($Hashes.ContainsKey($Name)) {
              throw "Duplicate checksum entry: $Name"
            }
            $Hashes[$Name] = $Hash
            $ParsedNames += $Name
          }

          $ExpectedNames = @($Artifacts | ForEach-Object { $_.Name })
          if (($ParsedNames -join "|") -ne ($ExpectedNames -join "|")) {
            throw "Checksum manifest filename/order mismatch"
          }

          foreach ($Artifact in $Artifacts) {
            $ExpectedHash = (Get-FileHash -Algorithm SHA256 -Path $Artifact.FullName).Hash.ToLowerInvariant()
            if ($Hashes[$Artifact.Name] -ne $ExpectedHash) {
              throw "Checksum mismatch for $($Artifact.Name)"
            }
          }
      - name: Attest release artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip
            release/Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe
            streamdeck-plugin/*.streamDeckPlugin
            release/build-manifest.json
            release/SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/Stream-State-Router-v${{ steps.version.outputs.version }}-portable.zip
            release/Stream-State-Router-v${{ steps.version.outputs.version }}-setup.exe
            streamdeck-plugin/*.streamDeckPlugin
            release/build-manifest.json
            release/SHA256SUMS.txt
          generate_release_notes: true
