name: Activation CI

on:
  push:
    branches:
      - feat/random-activation-foundation
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[desktop,dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: python -m ruff check .
      - name: Config smoke test
        run: python main.py --check-config
