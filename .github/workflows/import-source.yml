name: Import source archive

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract source archive
        shell: pwsh
        run: |
          $chunkDir = Join-Path $PWD "bootstrap/clean"
          if (-not (Test-Path $chunkDir)) { throw "bootstrap/clean is missing" }

          $base64Path = Join-Path $env:RUNNER_TEMP "ssr-source.b64"
          $zipPath = Join-Path $env:RUNNER_TEMP "ssr-source.zip"
          $temp = Join-Path $env:RUNNER_TEMP "ssr-import"

          $chunks = Get-ChildItem $chunkDir -Filter *.b64 | Sort-Object Name
          if (-not $chunks) { throw "No source chunks found" }

          $builder = [System.Text.StringBuilder]::new()
          foreach ($chunk in $chunks) {
            [void]$builder.Append((Get-Content $chunk.FullName -Raw).Trim())
          }
          [IO.File]::WriteAllText($base64Path, $builder.ToString(), [Text.Encoding]::ASCII)
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String([IO.File]::ReadAllText($base64Path)))

          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          New-Item -ItemType Directory -Path $temp | Out-Null
          Expand-Archive $zipPath $temp -Force

          $root = Get-ChildItem $temp -Directory | Select-Object -First 1
          if (-not $root) { throw "Archive does not contain a source directory" }

          Get-ChildItem -Force $root.FullName | ForEach-Object {
            Copy-Item $_.FullName $PWD -Recurse -Force
          }

          Remove-Item bootstrap -Recurse -Force

      - name: Commit imported source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "chore: import Stream State Router v2.0.11 source"
          git push
