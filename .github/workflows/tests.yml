name: Tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[desktop,dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: python -m ruff check .
      - name: Config smoke test
        run: python main.py --check-config

  streamdeck:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: streamdeck-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Emit generated lockfile
        shell: pwsh
        run: |
          Write-Host "LOCKFILE_BASE64_BEGIN"
          Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes("package-lock.json")))
          Write-Host "LOCKFILE_BASE64_END"
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate plugin
        run: npm run validate
