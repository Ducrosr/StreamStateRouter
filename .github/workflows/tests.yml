name: Tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[desktop,dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: python -m ruff check .
      - name: Config smoke test
        run: python main.py --check-config

  streamdeck:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: streamdeck-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate plugin
        run: npm run validate
      - name: Pack version override smoke test
        shell: pwsh
        run: |
          $Manifest = "com.remyducros.streamstaterouter.sdPlugin/manifest.json"
          $Before = Get-Content $Manifest -Raw
          try {
            npm run pack -- --version "9.9.9.9"
            if ($LASTEXITCODE -ne 0) { throw "Versioned Stream Deck pack failed" }
            $Plugin = Get-ChildItem *.streamDeckPlugin -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $Plugin) { throw "Versioned Stream Deck package missing" }
          }
          finally {
            Set-Content -Path $Manifest -Value $Before -Encoding utf8 -NoNewline
          }
