name: Tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -c constraints/windows-release.txt -e ".[desktop,dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: python -m ruff check .
      - name: Config smoke test
        run: python main.py --check-config
      - name: Declarative coverage smoke test
        run: python main.py --coverage-report
      - name: Declarative coverage JSON smoke test
        shell: pwsh
        run: |
          python main.py --coverage-json | python -m json.tool | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Invalid coverage JSON output" }
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $Scripts = @(
            ".\Install-And-Run.ps1",
            ".\scripts\build_windows.ps1",
            ".\scripts\run_dev.ps1"
          )
          foreach ($Script in $Scripts) {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Script),
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Details = ($Errors | ForEach-Object { $_.Message }) -join "; "
              throw "PowerShell syntax error in $Script : $Details"
            }
          }

  streamdeck:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: streamdeck-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate plugin
        run: npm run validate
