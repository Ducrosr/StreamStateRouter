name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          python -m venv .tests-venv
          $Scripts = (Resolve-Path ".\.tests-venv\Scripts").Path
          $Scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check "pip==26.2.1"
      - name: Install frozen Python dependency closure
        run: python -m pip install --disable-pip-version-check -r constraints/windows-release.txt
      - name: Install SSR from frozen closure
        run: python -m pip install --disable-pip-version-check --no-index --no-build-isolation -e ".[all]"
      - name: Verify Python dependency snapshot
        run: python scripts/verify_constraints.py constraints/windows-release.txt
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: python -m ruff check .
      - name: Config smoke test
        run: python main.py --check-config
      - name: Declarative coverage smoke test
        run: python main.py --declarative-coverage
      - name: Declarative coverage JSON smoke test
        shell: pwsh
        run: |
          python main.py --declarative-coverage-json | python -m json.tool | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Invalid coverage JSON output" }
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $Scripts = @(
            ".\Install-And-Run.ps1",
            ".\scripts\build_windows.ps1",
            ".\scripts\run_dev.ps1"
          )
          foreach ($Script in $Scripts) {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Script),
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Details = ($Errors | ForEach-Object { $_.Message }) -join "; "
              throw "PowerShell syntax error in $Script : $Details"
            }
          }

  streamdeck:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: streamdeck-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate plugin
        run: npm run validate
